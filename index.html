<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bestelformulier</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .product {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 12px;

            background-color: #ffffff;
        }

        .product img {
            width: 140px;
            height: 140px;

            object-fit: cover;

            border-radius: 10px;
        }

        .product-info {
            flex: 1;
        }

        .prijs {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .aantal-select {
            max-width: 120px;
        }

        @media (max-width: 600px) {

            .product {
                flex-direction: column;
                align-items: flex-start;
            }

            .product img {
                width: 100%;
                height: 220px;
            }
        }
    </style>
</head>


<body class="bg-light">

<div class="container mt-5 mb-5">

    <h1 class="mb-4">Bestelformulier</h1>

    <p>
        Vul dit formulier in om een bestelling te plaatsen.
        Je ontvangt een bevestiging via e-mail.
    </p>


    <form
        action="https://formspree.io/f/xwlkkaea"
        method="POST"
        class="border p-4 bg-white rounded"
    >


        <!-- GEGEVENS -->

        <h4 class="mb-3">Gegevens</h4>


        <div class="mb-3">

            <label
                for="naam"
                class="form-label"
            >
                Naam *
            </label>

            <input
                type="text"
                id="naam"
                name="naam"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label
                for="email"
                class="form-label"
            >
                E-mail *
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
            >

        </div>


        <hr>


        <!-- BESTELLING -->

        <h4 class="mb-4">Bestelling</h4>



        <!-- FLESJE 1 -->

        <div class="product">

            <img
                src="https://via.placeholder.com/300x300?text=Flesje+1"
                alt="Flesje 1"
            >

            <div class="product-info">

                <h5>Flesje 1</h5>

                <label
                    for="flesje1"
                    class="form-label"
                >
                    Aantal
                </label>

                <select
                    id="flesje1"
                    name="Flesje 1 aantal"
                    class="form-select aantal-select"
                >

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

                <div class="prijs">
                    €10,00
                </div>

            </div>

        </div>



        <!-- FLESJE 2 -->

        <div class="product">

            <img
                src="https://via.placeholder.com/300x300?text=Flesje+2"
                alt="Flesje 2"
            >

            <div class="product-info">

                <h5>Flesje 2</h5>

                <label
                    for="flesje2"
                    class="form-label"
                >
                    Aantal
                </label>

                <select
                    id="flesje2"
                    name="Flesje 2 aantal"
                    class="form-select aantal-select"
                >

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

                <div class="prijs">
                    €12,00
                </div>

            </div>

        </div>



        <!-- FLESJE 3 -->

        <div class="product">

            <img
                src="https://via.placeholder.com/300x300?text=Flesje+3"
                alt="Flesje 3"
            >

            <div class="product-info">

                <h5>Flesje 3</h5>

                <label
                    for="flesje3"
                    class="form-label"
                >
                    Aantal
                </label>

                <select
                    id="flesje3"
                    name="Flesje 3 aantal"
                    class="form-select aantal-select"
                >

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

                <div class="prijs">
                    €15,00
                </div>

            </div>

        </div>



        <!-- FLESJE 4 -->

        <div class="product">

            <img
                src="https://via.placeholder.com/300x300?text=Flesje+4"
                alt="Flesje 4"
            >

            <div class="product-info">

                <h5>Flesje 4</h5>

                <label
                    for="flesje4"
                    class="form-label"
                >
                    Aantal
                </label>

                <select
                    id="flesje4"
                    name="Flesje 4 aantal"
                    class="form-select aantal-select"
                >

                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

                <div class="prijs">
                    €20,00
                </div>

            </div>

        </div>


        <!-- OPMERKINGEN -->

        <div class="mb-3">

            <label
                for="opmerkingen"
                class="form-label"
            >
                Opmerkingen / speciale wensen
            </label>

            <textarea
                id="opmerkingen"
                name="opmerkingen"
                class="form-control"
                rows="4"
            ></textarea>

        </div>


        <button
            type="submit"
            class="btn btn-primary w-100"
        >
            Bestelling verzenden
        </button>


    </form>

</div>

</body>

</html>
